<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWCM Calculator</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#243047}h1,h2{color:#174b70}p{line-height:1.6}input{width:100px;padding:10px;font-size:16px;border:1px solid #aab8c5;border-radius:5px}button{padding:12px;margin:6px;background:#176b91;color:white;border:0;border-radius:6px;font-size:16px}table{border-collapse:collapse;width:100%;margin:15px 0}td,th{border:1px solid #aaa;padding:10px;text-align:center;white-space:nowrap}th{background:#e8f2f7}.scroll{overflow-x:auto}.highlight{background:#fff1bc}.box{padding:16px;background:#f1f6f9;border-radius:8px}.fields{display:flex;flex-wrap:wrap;gap:16px}label{display:block;margin-bottom:6px}#error{color:#b00020;white-space:pre-wrap}.note{font-size:14px;color:#536779}@media print{.controls,#entry,#error,button{display:none}.scroll{overflow:visible}table{break-inside:avoid}}</style></head>
<body><h1>NWCM 運輸分配計算器</h1><p>輸入工廠及配送中心數量，計算 NWCM 分配方案及總運輸成本。</p><div class="controls box"><div class="fields"><div><label for="m">Number of Factories</label><input id="m" type="number" min="1" max="30" value="3"></div><div><label for="n">Number of Centres</label><input id="n" type="number" min="1" max="30" value="4"></div></div><button id="build">建立輸入表格</button><button id="example">載入課堂 3 × 3 示例</button><p class="note">重新建立表格會清除已輸入的數據。</p></div><div id="entry"></div><p id="error" role="alert"></p><div id="output"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),EPS=1e-9,sum=a=>a.reduce((s,v)=>s+v,0),fmt=v=>Number(v.toFixed(8)).toString(),zeros=(m,n)=>Array.from({length:m},()=>Array(n).fill(0));let M,N;
function read(id,label){let e=$(id);if(!e||e.value.trim()==='')throw Error('請填寫：'+label);let v=Number(e.value);if(!Number.isFinite(v)||v<0)throw Error(label+' 必須是有限非負數。');return v}
function build(){let m=Number($('m').value),n=Number($('n').value);if(!Number.isInteger(m)||!Number.isInteger(n)||m<1||n<1||m>30||n>30){$('error').textContent='工廠及中心數量必須是 1 至 30 的整數。';return}M=m;N=n;$('error').textContent='';$('output').innerHTML='';let h='<h2>輸入數據</h2><p>格內填單位運費，Supply 為供應量，Demand 為需求量。所有欄位必須填寫，可填 0。</p><div class="scroll"><table><tr><th>Factory / Centre</th>';for(let j=0;j<N;j++)h+=`<th>C${j+1}</th>`;h+='<th>Supply</th></tr>';for(let i=0;i<M;i++){h+=`<tr><th>F${i+1}</th>`;for(let j=0;j<N;j++)h+=`<td><input id="c${i}_${j}" type="number" min="0" step="any" inputmode="decimal" aria-label="F${i+1} 到 C${j+1} 單位運費"></td>`;h+=`<td><input id="s${i}" type="number" min="0" step="any" inputmode="decimal" aria-label="F${i+1} Supply"></td></tr>`}h+='<tr><th>Demand</th>';for(let j=0;j<N;j++)h+=`<td><input id="d${j}" type="number" min="0" step="any" inputmode="decimal" aria-label="C${j+1} Demand"></td>`;h+='<td>—</td></tr></table></div><p class="note">總 Supply 必須等於總 Demand，否則不會計算。</p><button id="solve">計算 NWCM</button><button id="print">列印／另存 PDF</button>';$('entry').innerHTML=h;$('solve').addEventListener('click',solve);$('print').addEventListener('click',()=>window.print())}
function example(){$('m').value=3;$('n').value=3;build();[[4,8,5],[7,3,9],[6,4,7]].forEach((r,i)=>r.forEach((v,j)=>$('c'+i+'_'+j).value=v));[30,40,10].forEach((v,i)=>$('s'+i).value=v);[20,30,30].forEach((v,j)=>$('d'+j).value=v)}
function matrix(c,x,s,d,hi=null){let h='<div class="scroll"><table><tr><th>Factory / Centre</th>'+d.map((_,j)=>`<th>C${j+1}</th>`).join('')+'<th>Supply</th></tr>';c.forEach((r,i)=>{h+=`<tr><th>F${i+1}</th>`+r.map((v,j)=>`<td${hi&&hi[0]===i&&hi[1]===j?' class="highlight"':''}>${fmt(v)}${x&&x[i][j]>EPS?' ('+fmt(x[i][j])+')':''}</td>`).join('')+`<td>${fmt(s[i])}</td></tr>`});return h+'<tr><th>Demand</th>'+d.map(v=>`<td>${fmt(v)}</td>`).join('')+`<td>${fmt(sum(d))}</td></tr></table></div>`}
function cost(c,x){return sum(x.map((r,i)=>sum(r.map((q,j)=>q*c[i][j]))))}function expression(c,x){let a=[];x.forEach((r,i)=>r.forEach((q,j)=>{if(q>EPS)a.push(fmt(q)+' × '+fmt(c[i][j]))}));return a.join(' + ')||'0'}
function valid(x,s,d){return s.every((v,i)=>Math.abs(sum(x[i])-v)<1e-6)&&d.every((v,j)=>Math.abs(sum(x.map(r=>r[j]))-v)<1e-6)&&x.every(r=>r.every(v=>v>=-1e-6))}
function solve(){$('error').textContent='';$('output').innerHTML='';try{let c=Array.from({length:M},(_,i)=>Array.from({length:N},(_,j)=>read('c'+i+'_'+j,`F${i+1} → C${j+1} 運費`))),s=Array.from({length:M},(_,i)=>read('s'+i,`F${i+1} Supply`)),d=Array.from({length:N},(_,j)=>read('d'+j,`C${j+1} Demand`)),ts=sum(s),td=sum(d);if(!Number.isFinite(ts)||!Number.isFinite(td))throw Error('數值過大。');if(Math.abs(ts-td)>EPS)throw Error(`總供應量與總需求量必須相等。
總 Supply：${fmt(ts)}
總 Demand：${fmt(td)}
差額：${fmt(Math.abs(ts-td))}
請修改 Supply 或 Demand 後再計算。`);let h='<h2>原始矩陣</h2>'+matrix(c,null,s,d)+'<h2>NWCM 逐步分配</h2><p>括號內是分配量，括號外是單位運費。</p>',x=zeros(M,N),a=s.slice(),b=d.slice(),i=0,j=0,k=0;while(i<M&&j<N){if(a[i]<=EPS){i++;continue}if(b[j]<=EPS){j++;continue}let av=a[i],bv=b[j],q=Math.min(av,bv);x[i][j]+=q;a[i]-=q;b[j]-=q;h+=`<h3>Step ${++k}：F${i+1} → C${j+1}</h3>`+matrix(c,x,s,d,[i,j])+`<p>Allocate min(${fmt(av)}, ${fmt(bv)}) = ${fmt(q)}<br>F${i+1} 剩餘供應 = ${fmt(a[i])}；C${j+1} 剩餘需求 = ${fmt(b[j])}。</p>`}if(k===0)h+='<p>供應及需求均為 0，無需分配。</p>'+matrix(c,x,s,d);if(!valid(x,s,d))throw Error('供應需求核對失敗，請檢查數據精度。');let initial=cost(c,x);if(!Number.isFinite(initial))throw Error('成本數值過大。');h+='<h2>NWCM 最終分配方案</h2>'+matrix(c,x,s,d)+`<div class="box">Total Transportation Cost = ${expression(c,x)} = ${fmt(initial)}</div><h2>供應與需求核對</h2><div class="scroll"><table><tr><th>項目</th><th>原始數量</th><th>分配總量</th></tr>`;s.forEach((v,i)=>h+=`<tr><td>F${i+1} Supply</td><td>${fmt(v)}</td><td>${fmt(sum(x[i]))}</td></tr>`);d.forEach((v,j)=>h+=`<tr><td>C${j+1} Demand</td><td>${fmt(v)}</td><td>${fmt(sum(x.map(r=>r[j])))}</td></tr>`);h+='</table></div><p>✓ 所有供應及需求均通過核對。</p><p class="note">只計算 NWCM 初始可行方案，不進行成本最優化。小數計算使用浮點精度。</p>';$('output').innerHTML=h}catch(e){$('error').textContent=e.message}}
$('build').addEventListener('click',build);$('example').addEventListener('click',example);build();
</script></body></html>
